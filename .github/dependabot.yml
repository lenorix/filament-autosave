version: 2

updates:
  # This is a library, so composer.lock is intentionally not committed.
  # Dependabot still updates the constraints in composer.json.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Allow time to review compromised releases; Actions requires this setting.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
