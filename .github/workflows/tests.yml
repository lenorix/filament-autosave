name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        filament: ['^4.0', '^5.0']
        testbench: ['^10.0', '^11.0']
        include:
          - php: '8.4'
            filament: '^4.0'
            testbench: '^10.0'
            prefer: 'lowest'

    name: PHP ${{ matrix.php }} - Filament ${{ matrix.filament }} - Testbench ${{ matrix.testbench }}${{ matrix.prefer == 'lowest' && ' - lowest' || '' }}

    steps:
      - name: Fetch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Resolve dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction ${{ matrix.prefer == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Execute PHP and controller suites
        run: composer test

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --debug
